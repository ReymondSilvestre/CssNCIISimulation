<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computer Unit Lab – CSS NC II</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10253a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="side" class="panel">
  <div class="shead">
    <img class="slogo" src="logo.png" alt="SylverVibeCode logo">
    <button id="hide" type="button" aria-label="Hide side menu" title="Hide menu"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <h1>Computer Unit Lab</h1>
  <div class="sub">Computer Systems Servicing NC II</div>

  <section class="dv" id="dv1">
    <button type="button" class="dh" aria-expanded="true"><span>1 &middot; Lab menu</span><i></i></button>
    <div class="db">
      <div class="stat" id="trn"></div>
      <div class="stat" id="stu"></div>
      <div class="stat" id="net"></div>
      <div class="row" id="units"><button data-u="1" class="on">1 Install</button><button data-u="2">2 Networks</button><button data-u="3">3 Servers</button><button data-u="4">4 Repair</button></div>
      <div class="row"><button id="fin" class="warn">Finish and see score</button></div>
    </div>
  </section>

  <section class="dv" id="dv2">
    <button type="button" class="dh" aria-expanded="true"><span>2 &middot; Work station</span><i></i></button>
    <div class="db">
      <div class="row" id="modes">
        <button data-m="identify" class="on">Identify</button>
        <button data-m="dis">Disassemble</button>
        <button data-m="asm">Assemble</button>
      </div>
      <div class="row">
        <button id="esd" class="warn">ESD strap: off</button>
      </div>
      <div class="row">
        <button id="autoD">Auto take apart</button>
        <button id="autoA">Auto build</button>
      </div>
      <div class="row"><button id="quiz">Start quiz (5 questions)</button></div>
      <div class="row"><button id="pwr">Power on the PC</button><button id="del" disabled>Press DEL</button></div>
      <ul id="list"></ul>
      <div class="stat" id="stat"></div>
    </div>
  </section>
</div>
<button id="menu" aria-label="Show side menu">Menu</button>
<div id="zoom" class="panel"><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><button id="rv" class="w">Rear view</button><button id="fs" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="trbtn" aria-label="Trainer settings"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
<div id="info" class="panel"><h2>Hover or click a part</h2><p>Identify mode: click parts to learn what they do. Remove the side panel to see inside.</p></div>
<div id="cam" class="panel">
  <button id="hand" type="button" aria-label="Hand control: off" aria-pressed="false" title="Hand control: off"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v1M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.4L3.4 16a2 2 0 0 1 3.2-2.4L8 15"/></svg></button>
  <div id="camv">
    <video id="vid" playsinline muted></video>
    <small id="hs">Point to move the cursor. Pinch to grab a part, move your hand, open your fingers to drop.</small>
  </div>
</div>
<div id="act"><div id="awin"><div id="atop"><button data-u="1">1 Install and configure computer systems</button><button data-u="2">2 Set up computer networks</button><button data-u="3">3 Set up computer servers</button><button data-u="4">4 Maintain and repair systems and networks</button><button id="afin">Finish and see score</button></div><div id="abody"><div id="alist"></div><div id="amain"></div></div></div></div>
<div id="bios"><div id="bwin"></div></div>
<div id="ov"></div>
<div id="tr"></div>
<div id="toast"></div>
<div id="cursor"></div>


<script src="lib/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>')</script>
<script async src="lib/mediapipe/hands.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="trainer.js"></script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body>
</html>
